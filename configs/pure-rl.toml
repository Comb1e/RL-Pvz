profile = "pure-rl"
schema_version = 1
engine_commit = "6fd1f54706369915013a49eab5c1790f8c55ab0a"
engine_version = "1.0.0"
engine_package_version = "1.2.1"

[runtime]
cache_legal_actions = true
coalesce_masks = true
cache_rollout_on_device = true

[logging]
progress_seconds = 15
rolling_window = 100

[visualization]
enabled = true
demos = true
videos = false
video_size = [1280, 820]
ffmpeg = "" # Empty discovers ffmpeg on PATH.
crf = 23
final_hold_seconds = 2

[environment]
decision_ticks = 10
cutoff_seconds = 1200
rows = 5
cols = 9
bins = 20
plants = ["sunflower", "peashooter", "wall_nut", "cherry_bomb", "potato_mine", "snow_pea", "chomper", "repeater"]
zombies = ["basic", "flag", "conehead", "buckethead", "pole_vaulting"]
plant_states = ["ready", "arming", "armed", "fusing", "digesting", "exploding", "detonating"]
zombie_states = ["walking", "carrying_pole", "vaulting", "biting", "dead"]
mower_states = ["ready", "moving", "spent"]

[encoding]
version = "tactical_v2"
local_count_scale = 5
firepower_scale = 20
lane_count_scale = 9
count_scale = 75
wave_scale = 15

[reward]
plant_kill_weight = 1.0
mower_kill_weight = 1.0
normalize_kills = true
gamma = 0.999
defeated_weight = 0.5
sun_weight = 0.3
flower_weight = 0.2
sun_target = 300
flower_target = 8

[training]
total_steps = 3000000
learner_seeds = [101, 102, 103, 104, 105]
n_envs = 8
device = "cuda"
rollout_size = 4096
batch_size = 256
n_epochs = 4
learning_rate = 0.0003
gae_lambda = 0.98
clip_range = 0.2
ent_coef = 0.01
hidden_sizes = [256, 256]
eval_interval = 250000
torch_threads = 1

[curriculum]
mode = "teaching"
probe_interval = 16384
probe_cases = 20
consecutive_passes = 2
minimum_stage_steps = 16384

boundaries = [0.1, 0.4]
easy_weights = [1.0, 0.0, 0.0]
intermediate_weights = [0.5, 0.5, 0.0]
final_weights = [0.2, 0.4, 0.4]

[splits]
train = [1000, 99999]
validation = [100000, 100049]
test = [200000, 200299]
ood = [300000, 300099]

[evaluation]
levels = ["easy", "standard", "hard"]
ood_families = ["redistributed", "faster", "concentrated"]
ood_levels = ["standard", "hard"]
replays_per_outcome = 10
bootstrap_replicates = 2000
bootstrap_seed = 1739
targets = [0.95, 0.90, 0.75]

[conditions.masked]
masked = true
shaped = true
curriculum = true
hybrid = false

[conditions.unmasked]
masked = false
shaped = true
curriculum = true
hybrid = false

[conditions.sparse]
masked = true
shaped = false
curriculum = true
hybrid = false

[conditions.mixed]
masked = true
shaped = true
curriculum = false
hybrid = false

[conditions.hybrid]
masked = true
shaped = true
curriculum = true
hybrid = true

[policy]
kind = "grouped_v1"

[curriculum.lessons.placement]
spawn_ticks = [1, 81, 161]
initial_sun = 200
allowed_plants = ["peashooter"]

[curriculum.lessons.saving]
spawn_ticks = [1200, 1280, 1360]
initial_sun = 50
allowed_plants = ["sunflower", "peashooter"]

[curriculum.stages.placement]
tasks = ["placement"]
weights = [1.0]
requirements = {placement = 18}

[curriculum.stages.saving]
tasks = ["saving", "placement"]
weights = [0.8, 0.2]
requirements = {saving = 18}

[curriculum.stages.easy]
tasks = ["easy", "placement", "saving"]
weights = [0.8, 0.1, 0.1]
requirements = {easy = 16}

[curriculum.stages.standard]
tasks = ["easy", "standard", "saving"]
weights = [0.45, 0.45, 0.1]
requirements = {easy = 16, standard = 12}

[curriculum.stages.shared]
tasks = ["easy", "standard", "hard"]
weights = [0.2, 0.4, 0.4]
requirements = {}
