profile = "sc2-plant-rewards-v2"
schema_version = 1
engine_commit = "8861824df6893a34c2cd4df7f9b68613376d7964"
engine_version = "1.0.0"
engine_package_version = "1.3.0"

[runtime]
cache_legal_actions = true
refill_evaluation = true

[logging]
progress_seconds = 15
rolling_window = 100

[visualization]
enabled = true
demos = true
videos = false
video_size = [1280, 820]
ffmpeg = "" # Empty discovers ffmpeg on PATH.
crf = 23
final_hold_seconds = 2

[environment]
action_timing = "per_tick"
decision_ticks = 1
cutoff_seconds = 1200
rows = 5
cols = 9
bins = 20
plants = ["sunflower", "peashooter", "wall_nut", "cherry_bomb", "potato_mine", "snow_pea", "chomper", "repeater"]
zombies = ["basic", "flag", "conehead", "buckethead", "pole_vaulting"]
plant_states = ["ready", "arming", "armed", "fusing", "digesting", "exploding", "detonating"]
zombie_states = ["walking", "carrying_pole", "vaulting", "biting", "dead"]
mower_states = ["ready", "moving", "spent"]

[encoding]
version = "tactical_v2"
local_count_scale = 5
firepower_scale = 20
lane_count_scale = 9
count_scale = 75
wave_scale = 15

[reward]
win_reward = 1.0
loss_penalty = 2.0
plant_kill_weight = 1.0
mower_kill_weight = 2.0
normalize_kills = true
damage_weight = 1.0
empty_mower_activation_penalty = 0.2
mower_sun_weight = 1.0
mower_sun_scale = 300.0
wall_nut_damage_weight = 0.2
empty_explosion_penalty = 0.2
offensive_plant_weight = 0.1
eaten_plant_penalty = 0.02
offensive_plants = ["peashooter", "snow_pea", "repeater", "chomper"]
gamma = 0.999
potential_mode = "plant_value"
defeated_weight = 0.5
economy_weight = 0.5
economy_scale = 300

[training]
budget_unit = "games"
total_games = 10000
eval_interval_games = 2000
total_steps = 3000000 # Inactive unless budget_unit = "decisions" (legacy).
learner_seeds = [101, 102]
n_envs = 128
device = "cuda"
rollout_size = 16384
rollout_steps_per_env = 128
max_minutes = 120
finalization_minutes = 15
actor_objective = "choice_points_v1"
exploration = {objective = "balanced_heads_v1", type_coef = 0.01, tile_coef = 0.001}
batch_size = 1024
n_epochs = 4
learning_rate = 0.0003
gae_lambda = 0.999
clip_range = 0.2
ent_coef = 0.01
hidden_sizes = [256, 256]
eval_interval = 250000 # Legacy decision interval; new runs use eval_interval_games.
torch_threads = 1

[curriculum]
mode = "teaching"
residency = "episode_start_stage"
probe_interval_games = 500
minimum_stage_games = 100
probe_interval = 16384
probe_cases = 100
consecutive_passes = 1
minimum_stage_steps = 16384

boundaries = [0.1, 0.4]
easy_weights = [1.0, 0.0, 0.0]
intermediate_weights = [0.5, 0.5, 0.0]
final_weights = [0.2, 0.4, 0.4]

[splits]
train = [1000, 99999]
validation = [100000, 100049]
curriculum = [100050, 100149] # Separate mastery cases; never final-test seeds.
test = [200000, 200299]
ood = [300000, 300099]

[evaluation]
levels = ["easy", "standard", "hard"]
ood_families = ["redistributed", "faster", "concentrated"]
ood_levels = ["standard", "hard"]
replays_per_outcome = 10
bootstrap_replicates = 2000
bootstrap_seed = 1739
targets = [0.95, 0.90, 0.75]

[conditions.masked]
masked = true
shaped = true
curriculum = true
hybrid = false

[conditions.unmasked]
masked = false
shaped = true
curriculum = true
hybrid = false

[conditions.sparse]
masked = true
shaped = false
curriculum = true
hybrid = false

[conditions.mixed]
masked = true
shaped = true
curriculum = false
hybrid = false


[policy]
kind = "spatial_grouped_v2"
initial_dig_logit = -6.0
channels = 64

[curriculum.lessons.placement]
spawn_ticks = [1, 81, 161]
initial_sun = 200
allowed_plants = ["peashooter"]

[curriculum.lessons.saving]
spawn_ticks = [1200, 1280, 1360]
initial_sun = 50
allowed_plants = ["sunflower", "peashooter"]

[curriculum.stages.placement]
tasks = ["placement"]
weights = [1.0]
requirements = {placement = 100}

[curriculum.stages.saving]
tasks = ["saving", "placement"]
weights = [0.8, 0.2]
requirements = {saving = 100}

[curriculum.stages.easy]
tasks = ["easy", "placement", "saving"]
weights = [0.8, 0.1, 0.1]
requirements = {easy = 100}

[curriculum.stages.standard]
tasks = ["easy", "standard", "saving"]
weights = [0.45, 0.45, 0.1]
requirements = {easy = 100, standard = 100}

[curriculum.stages.shared]
tasks = ["easy", "standard", "hard"]
weights = [0.2, 0.4, 0.4]
requirements = {easy = 100, standard = 100, hard = 100}

[simulation]
backend = "cuda"

[diagnostics]
early_dig_seconds = 5
