profile = "complete-game"
schema_version = 1
engine_commit = "fdab989fe20ad3415c2b8975fccdeec834d0196e"
engine_version = "1.3.0"
engine_package_version = "1.6.0"

[runtime]
cache_legal_actions = true
refill_evaluation = true

[logging]
progress_seconds = 15
hardware_sample_seconds = 1.0
rolling_window = 100

[visualization]
live_enabled = true
live_fps = 5
live_history_ram_mib = 16
live_window_size = [1600, 1050]
enabled = true
demos = true
videos = false
video_fps = 25
video_size = [1280, 820]
ffmpeg = "" # Empty discovers ffmpeg on PATH.
crf = 23
final_hold_seconds = 2

[environment]
action_timing = "per_tick"
decision_ticks = 1
cutoff_seconds = 1200
rows = 5
cols = 9
bins = 3
plants = ["sunflower", "peashooter", "wall_nut", "cherry_bomb", "potato_mine", "snow_pea", "chomper", "repeater"]
zombies = ["basic", "flag", "conehead", "buckethead", "pole_vaulting"]
plant_states = ["ready", "arming", "armed", "fusing", "digesting", "exploding", "detonating"]
zombie_states = ["walking", "carrying_pole", "vaulting", "biting", "dead"] # Engine schema only; not policy inputs.
mower_states = ["ready", "moving", "spent"]

[encoding]
version = "event_v7"
local_count_scale = 5
count_scale = 75
wave_scale = 15

[reward]
version = "net_value_v1"
win_reward = 1.0
loss_penalty = 2.0
basic_zombie_value = 50.0 # Sun-equivalent value per basic zombie's actual HP removed.
mower_value = 200.0
progress_weight = 0.01
value_scale = 300.0 # Unit conversion, never a sun cap.
invalid_plant_penalty = 0.001 # Rejected plant proposal, 30 sun-equivalents.
empty_dig_penalty = 0.0003333333333333333 # Empty dig proposal, 10 sun-equivalents.

[training]
gamma = 1.0
discount_clock = "simulation_ticks"
method = "sequential_q_mc_v2"
budget_unit = "games"
until_stage_complete = false # With --stage: stop only when its mastery gate passes.
total_games = 10000
validation_schedule = "stage_success" # Normal-game evaluation only after each stage passes.
eval_interval_games = 2000 # Used by diagnostic/fixed training or archived periodic schedules.
total_steps = 3000000 # Inactive unless budget_unit = "decisions" (legacy).
learner_seeds = [101, 102]
n_envs = 128
device = "cuda"
max_minutes = 120
finalization_minutes = 15
# Plant-only exploration is fixed throughout each complete-game cohort.
exploration = {objective = "sequential_plant_epsilon_v1", epsilon_start = 0.1, epsilon_floor = 0.001, decay_games = 3000}
batch_size = 1024
n_epochs = 4
learning_rate = 0.0003
max_grad_norm = 0.5
hidden_sizes = [128, 128]
eval_interval = 250000 # Periodic decision interval for archived/diagnostic protocols.
torch_threads = 1

[training.storage]
ram_gib = 6
block_rows = 32768

[training.performance]
token_cache_gib = 2
compile_kernels = true
telemetry = true

[curriculum]
mode = "teaching"
residency = "episode_start_stage"
probe_interval_games = 2000
minimum_stage_games = 100
probe_interval = 16384
probe_cases = 100
consecutive_passes = 1
minimum_stage_steps = 16384

boundaries = [0.1, 0.4]
easy_weights = [1.0, 0.0, 0.0]
intermediate_weights = [0.5, 0.5, 0.0]
final_weights = [0.2, 0.4, 0.4]

[splits]
train = [1000, 99999]
validation = [100000, 100049]
curriculum = [100050, 100149] # Separate mastery cases; never final-test seeds.
test = [200000, 200299]
ood = [300000, 300099]

[evaluation]
levels = ["easy", "standard", "hard"]
ood_families = ["redistributed", "faster", "concentrated"]
ood_levels = ["standard", "hard"]
replays_per_outcome = 10
bootstrap_replicates = 2000
bootstrap_seed = 1739
targets = [0.95, 0.90, 0.75]

[conditions.masked]
masked = true
shaped = true
curriculum = true
hybrid = false

[policy]
kind = "event_sequential_q_v2"
action_distribution = "sequential_q_unmasked_penalty_v1"
plant_embedding = 8
state_embedding = 4
scalar_sizes = [64]
channels = [32, 32]

[curriculum.lessons.saving]
spawn_ticks = [7500, 8700, 9900] # 75 seconds, then every 12 seconds in three lanes.
initial_sun = 100
natural_sun = false
lanes_per_spawn = 3
allowed_plants = ["sunflower", "peashooter", "wall_nut", "cherry_bomb", "potato_mine", "snow_pea", "chomper", "repeater"]

[curriculum.stages.saving]
tasks = ["saving"]
weights = [1.0]
requirements = {saving = 100}

[curriculum.stages.easy]
tasks = ["easy", "saving"]
weights = [0.8, 0.2]
requirements = {easy = 100}

[curriculum.stages.standard]
tasks = ["easy", "standard", "saving"]
weights = [0.45, 0.45, 0.1]
requirements = {easy = 100, standard = 100}

[curriculum.stages.shared]
tasks = ["easy", "standard", "hard"]
weights = [0.2, 0.4, 0.4]
requirements = {easy = 100, standard = 100, hard = 100}

[simulation]
backend = "cuda"

[diagnostics]
early_dig_seconds = 5

[policy.memory]
model_width = 128
layers = 2
heads = 4
feedforward_width = 256
local_tokens = 8
event_tokens = 32
summary_tokens = 8
summary_stride = 100
gate_bias = 2.0
