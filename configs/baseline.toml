profile = "baseline"
schema_version = 1
engine_commit = "6fd1f54706369915013a49eab5c1790f8c55ab0a"
engine_version = "1.0.0"
engine_package_version = "1.2.1"

[runtime]
cache_legal_actions = true
coalesce_masks = true
cache_rollout_on_device = true

[logging]
progress_seconds = 15
rolling_window = 100

[visualization]
enabled = true
demos = true
videos = false
video_size = [1280, 820]
ffmpeg = "" # Empty discovers ffmpeg on PATH.
crf = 23
final_hold_seconds = 2

[environment]
decision_ticks = 10
cutoff_seconds = 1200
rows = 5
cols = 9
bins = 20
plants = ["sunflower", "peashooter", "wall_nut", "cherry_bomb", "potato_mine", "snow_pea", "chomper", "repeater"]
zombies = ["basic", "flag", "conehead", "buckethead", "pole_vaulting"]
plant_states = ["ready", "arming", "armed", "fusing", "digesting", "exploding", "detonating"]
zombie_states = ["walking", "carrying_pole", "vaulting", "biting", "dead"]
mower_states = ["ready", "moving", "spent"]

[encoding]
version = 1
count_scale = 75
wave_scale = 15

[reward]
plant_kill_weight = 1.0
mower_kill_weight = 2.0
normalize_kills = true
damage_weight = 1.0
empty_mower_activation_penalty = 0.2
gamma = 0.999
potential_mode = "plant_value"
defeated_weight = 0.5
economy_weight = 0.5
economy_scale = 300

[training]
total_steps = 3000000
learner_seeds = [101, 102, 103, 104, 105]
n_envs = 8
device = "cuda"
rollout_size = 4096
batch_size = 256
n_epochs = 4
learning_rate = 0.0003
gae_lambda = 0.98
clip_range = 0.2
ent_coef = 0.01
hidden_sizes = [256, 256]
eval_interval = 250000
torch_threads = 1

[curriculum]
boundaries = [0.1, 0.4]
easy_weights = [1.0, 0.0, 0.0]
intermediate_weights = [0.5, 0.5, 0.0]
final_weights = [0.2, 0.4, 0.4]

[splits]
train = [1000, 99999]
validation = [100000, 100049]
test = [200000, 200299]
ood = [300000, 300099]

[evaluation]
levels = ["easy", "standard", "hard"]
ood_families = ["redistributed", "faster", "concentrated"]
ood_levels = ["standard", "hard"]
replays_per_outcome = 10
bootstrap_replicates = 2000
bootstrap_seed = 1739
targets = [0.95, 0.90, 0.75]

[conditions.masked]
masked = true
shaped = true
curriculum = true
hybrid = false

[conditions.unmasked]
masked = false
shaped = true
curriculum = true
hybrid = false

[conditions.sparse]
masked = true
shaped = false
curriculum = true
hybrid = false

[conditions.mixed]
masked = true
shaped = true
curriculum = false
hybrid = false

[conditions.hybrid]
masked = true
shaped = true
curriculum = true
hybrid = true
