[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pvz-plant-research"
version = "0.1.0"
description = "Reproducible plant-placement reinforcement learning for Lawn Lab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pvz-research-game==1.0.0", "numpy>=2,<3", "gymnasium>=1.2,<1.3",
  "stable-baselines3>=2.7,<2.8", "sb3-contrib>=2.7,<2.8",
  "torch>=2.8,<2.9", "matplotlib>=3.9,<4", "tensorboard>=2.18,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "ruff>=0.11,<1", "build>=1,<2"]
ui = ["pygame-ce>=2.5,<3"]

[project.scripts]
pvz-rl = "pvz_rl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pvz_rl = ["data/*.toml", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["learning: short real learning and checkpoint integration checks"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
