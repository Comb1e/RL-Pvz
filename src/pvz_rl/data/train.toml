profile = "complete-game"
schema_version = 1
engine_commit = "ea84293d09618b6ef94910d66f835e33781387fc"
engine_version = "1.4.0"
engine_package_version = "1.7.1"

[runtime]
cache_legal_actions = true
refill_evaluation = true

[logging]
progress_seconds = 15
terminal_progress_seconds = 60
terminal_mode = "compact"
hardware_sample_seconds = 1.0
rolling_window = 100

[visualization]
live_enabled = true
viewer = "auto"
live_fps = 5
live_history_ram_mib = 16
live_window_size = [1600, 1050]
enabled = true
demos = true
videos = false
video_fps = 25
video_size = [1280, 820]
ffmpeg = "" # Empty discovers ffmpeg on PATH.
crf = 23
final_hold_seconds = 2

[environment]
# The pinned engine advances at 100 Hz. The agent makes one decision every
# 100 / action_frequency_hz simulator ticks; edit this value to change cadence.
action_frequency_hz = 10
cutoff_seconds = 1200
rows = 5
cols = 9
plants = ["sunflower", "peashooter", "wall_nut", "cherry_bomb", "potato_mine", "snow_pea", "chomper", "repeater"]
zombies = ["basic", "flag", "conehead", "buckethead", "pole_vaulting"]
plant_states = ["ready", "arming", "armed", "fusing", "digesting", "exploding", "detonating", "rising", "biting", "biting_got_one", "recovering"]
zombie_states = ["walking", "carrying_pole", "vaulting", "biting", "dead"]
mower_states = ["ready", "moving", "spent"]

[encoding]
version = "entity_public_v4"
max_entities = 256 # RTX 4070 Laptop: lower attention cost than 512; see docs/math/entity-inputs.md.
count_scale = 75
wave_scale = 15

[reward]
version = "action_global_value_v5"
win_reward = 1.0
loss_penalty = 1.0
basic_zombie_value = 50.0
mower_penalty = 0.1 # Direct final-unit penalty; independent of sunlight/dense scaling.
progress_weight = 0.01
value_scale = 500.0 # Raw physical shaping is progress_weight / value_scale.
asset_loss_multiplier = 2.2222222222222223 # Preserve plant asset-loss rewards; produced sun is unscaled.
home_entry_penalties = [0.005, 0.015] # First entry into the second, then first column.
win_time_weight = 0.3 # Maximum absolute signed-quadratic cohort rank adjustment.
early_sun_extra_multiplier = 6.0
early_sun_spawn_fraction = [1, 3]

[reward.passivity]
# Residual sunlight shaping is applied after a cohort finishes. Wins receive
# a separate terminal reward; losses distribute a separate penalty over waits.
win_max_reward = 0.2
win_reserve = 0.0
loss_max_penalty = 0.1
loss_reserve = 200.0
sun_reference = 1000.0

[reward.action]
sun_credit_multiplier = 1.0
# Raw blocker credit per health point, compensated by 2000/900 to preserve
# fitted rewards. Global asset loss records health damage separately.
block_value_by_plant = { sunflower = 0.074074074, peashooter = 0.074074074, wall_nut = 0.05555555555555556, cherry_bomb = 0.074074074, potato_mine = 0.074074074, snow_pea = 0.074074074, chomper = 0.074074074, repeater = 0.074074074 }

[training]
gamma = 1.0
discount_clock = "simulation_ticks"
method = "nstep_fork_forecast_v3"
budget_unit = "games"
until_stage_complete = false # With --stage: stop only when its mastery gate passes.
total_games = 10000
total_steps = 3000000 # Inactive in normal training; bounded decision-window controls only.
learner_seeds = [101, 102]
random_cohort_seeds = true # Independent fresh cohort seeds; pending draws persist for recovery.
device = "cuda"
max_minutes = 120
finalization_minutes = 15
batch_size = 1024
n_epochs = 4 # Complete fitting passes per cohort, all using that cohort's stage.
learning_rate = 0.0003
max_grad_norm = 5 # Shared by autonomous training and demonstration initialization.
eval_interval = 250000 # Used only by bounded decision-window diagnostics.
torch_threads = 1

[training.validation_trigger]
enabled = true # Missing in older checkpoints: retain their original validation workflow.
cohort_success_threshold = 0.9 # Strictly above; full configured cohorts only (normally 116/128).

[training.forecasts]
enabled = true
supervision_version = 3 # Missing in saved runs: preserve legacy labels and forks.
effect_objective = "absolute_outcome_v3" # Direct post-action outcomes; legacy recoveries retain signed effects.
effect_conditional_weight = 1.0 # Used by saved change_conditional_v2 objectives only.
protocol = "static-fork-threat-effect-v1"
probe = "conehead" # One reference threat per lane; retain damaged field-phase defenses.
extra_actions = 2 # Branch runner-up, then one uniformly legal remaining action.
wait_effect_sample_probability = 0.005
collection_protocol = "wait_trajectory_v3"
lanes = 1024 # Upper bound; allocate no more than the current cohort can request.
vram_mib = 1536 # Shared by physical scratch, job storage and the disposable cache.
chunk_ticks = 1024
warmup_games = 2048 # Completed main games; auxiliary weight ramps from zero.
injection_after_games = 4096
n_step = 5
injected_n_step = 20
initial_discount_half_life_steps = 60
discount_half_life_steps = 600 # Longer horizon after injection; 60 simulated seconds at 10 Hz.
pretrain_roots = 2048
pretrain_passes = 4
pretrain_execution = "device_pipeline_v1" # Missing in saved runs: retain sequential private panels.
pretrain_queue_panels = 32 # Simulation waves only; optimizer panels remain 32 roots.
pretrain_simulation_lanes = 1024 # Admitted against the existing forecast VRAM cap.
pretrain_simulation_ticks = 32768 # Independent of the unchanged private-play action cadence.
pretrain_graphs = true # Bounded eager capture; optimizer/EMA commits retain their order.
shaping_weight = 0.0 # Disabled initially. Do not use network forecasts as rewards.
shaping_weights = [1.0, 1.0, 1.0, 0.25] # Field depth, breach urgency, loss, probe depth.
measure_gradient_norms = true # First fitted microbatch per cohort only.

[training.tile_scenarios]
enabled = true # Automatic preliminary stages; selected normal stages skip them.
sampling_max_attempts = 100

[training.cherry_bomb]
forecast_mode = "placement_only" # Placement objective only; no threat prediction or forecast forks.
# Saved recoveries retain their original supervision mode and weights.
effect_prediction_weight = 0.1
threat_prediction_weight = 0.0
# Shared by both bomb stages except temperature and validation mastery; no exploration or search.
n_envs = 640 # Fastest measured collection time/env with 32 workers and the CUDA oracle.
probe_interval_games = 10000 # Independent clock for each bomb stage; pending probes retry first.
validation_success_threshold = 0.95 # Cherry Bomb only: strictly exceed this rate (96/100).
initial_sun = 150
plants = [1, 8]
obstacle_plants = [1, 15] # Fill competing blast cells first; reserve exactly one successful tile.
mower_ready_probability = 0.5 # Independent per row; otherwise disappeared (spent).
ranking_objective = "set_cross_entropy_v1" # Sole loss: -log(total successful-tile probability).
softmax_temperature = { zero_success = 0.5, full_success = 1 } # Linear in completed cohort hit rate; fixed during its fitting passes.
prepare_workers = 32 # Capped by logical CPUs and the shared host-memory budget.
worker_ram_mib = 94 # Reserved per worker, deducted from trajectory storage.
prefetch = true # One uncommitted CPU cohort overlaps fitting; resume regenerates it.
oracle = "cuda" # "cpu" retains the exact fork-based reference implementation.
cuda_warmup = true # Advance initial cooldowns in the existing CUDA scratch lanes.
oracle_lanes = 2048 # Shrinks to fit VRAM without changing labels.
oracle_vram_mib = 2048

[training.cherry_bomb_obstacle]
forecast_mode = "placement_only"
effect_prediction_weight = 0.1
threat_prediction_weight = 0.0
softmax_temperature = { zero_success = 1, full_success = 1 } # Independent schedule; mastery still requires 100/100.

[training.attacker_pre]
forecast_mode = "placement_only"
effect_prediction_weight = 0.1
threat_prediction_weight = 0.0
n_envs = 640 # Lowest measured collection time/env on the RTX 4070 Laptop profile.
plants = [4, 8] # Total across four non-zombie lanes; at least one in each.
zombie_count = [1, 2] # Basic zombies, all in the remaining empty lane.
provided_plants = ["potato_mine", "peashooter", "repeater", "snow_pea"]
initial_sun = 200
mower_ready_probability = 0.5
ranking_objective = "set_cross_entropy_v1"
softmax_temperature = { zero_success = 0.5, full_success = 1.0 }
probe_interval_games = 10000
prepare_workers = 16 # Eight is effectively tied; sixteen had the lowest aggregate mean.
worker_ram_mib = 96
prefetch = true
cuda_warmup = true # Natural initial cooldown only; distance labels use no candidate rollouts.
oracle_lanes = 640 # Independent scratch limits; used only for natural cooldown warmup.
oracle_vram_mib = 1024

[training.peashooter]
forecast_mode = "action_outcomes" # Teacher plus field/probe targets; no factual threat prediction.
extra_actions = 0 # The placement teacher supplies targets; retain actual-action effects only.
effect_prediction_weight = 0.1
threat_prediction_weight = 0.0
# Independent cohort/preparation sizing; shared optimizer and fitting passes.
n_envs = 128
sky_sun_rate = 1.5 # Divide sky-drop delays by this rate; keep each drop at 25 sun.
probe_interval_games = 2000
validation_success_threshold = 0.95 # Strictly exceed this rate (96/100); separate from cohort qualification.
fitting_objective = "prioritized_lane_cross_entropy_v1"
column_decay = 0.5 # Preferred-cell target weight halves with each column to the right.
softmax_temperature = 1.0
prepare_workers = 0 # In-process projection beat persistent worker IPC after setup reuse.
snapshot_cache_mib = 256 # Charged against the shared RAM budget; excess spills to owned storage.
oracle_lanes = 1024 # Fastest repeated 90-second resource screen on the RTX 4070 Laptop.
oracle_vram_mib = 4096 # Upper bound; actual lanes shrink to preserve profile headroom.
oracle_chunk_ticks = 4096

[training.normal]
forecast_mode = "action_outcomes" # Post-action field/probe targets only; saved factual runs stay unchanged.
n_envs = 128
effect_prediction_weight = 0.1
threat_prediction_weight = 0.0
validation_schedule = "stage_success" # Evaluate normal games only after each stage passes.
eval_interval_games = 2000 # Periodic game-count diagnostic/fixed checks.
# Species exploration stays fixed throughout a cohort; tile proposals are greedy.
# Ordinary waits trigger the same plant probability check once per interval.
exploration = {objective = "committed_species_epsilon_v1", plant_epsilon_start = 0.1, plant_epsilon_floor = 0.03, plant_decay_games = 10000, plant_wait_check_seconds = 15.0}

[training.normal.curriculum]
mode = "teaching"
residency = "episode_start_stage"
probe_interval_games = 2000
minimum_stage_games = 100
probe_interval = 16384
probe_cases = 100 # Shared validation panel size for every stage.
consecutive_passes = 1
minimum_stage_steps = 16384
boundaries = [0.1, 0.4]
easy_weights = [1.0, 0.0, 0.0]
intermediate_weights = [0.5, 0.5, 0.0]
final_weights = [0.2, 0.4, 0.4]

[training.normal.curriculum.stages.easy]
tasks = ["easy"]
weights = [1.0]
requirements = {easy = 100}

[training.normal.curriculum.stages.standard]
tasks = ["easy", "standard"]
weights = [0.5, 0.5]
requirements = {easy = 100, standard = 100}

[training.normal.curriculum.stages.shared]
tasks = ["easy", "standard", "hard"]
weights = [0.2, 0.4, 0.4]
requirements = {easy = 100, standard = 100, hard = 100}

[training.storage]
ram_gib = 6
block_rows = 32768

[training.objective]
protocol = "nstep_fork_forecast_v3"
accepted_outcome_share = 0.5
species_consistency_weight = 1.0 # Verified demo objective only; normal Q fitting omits consistency.
species_consistency_huber_delta = 1.0
invalid_action_q_offset = -0.1 # Illegal target = detached current head minimum Q + this offset.
invalid_fit_group_size = 2 # Shared first-of-window size for invalid proposals and waits.
dense_multiplier = 10.0
ema_decay = 0.95
demo_rank_loss_weight = 0.10
demo_rank_margin = 0.05

[training.performance]
auxiliary_hybrid = false # Opt in: the 128-env control still drained more slowly than synchronous execution.
interval_backend = "packed_async" # Interval-only device roots; teacher keeps its existing workflow.
auxiliary_cpu_workers = 4 # Fastest asynchronous setting in the warmed 4/8/12-worker screen.
auxiliary_worker_ram_mib = 192
auxiliary_cuda_target_ms = 2.0
auxiliary_vram_mib = 4096 # Combined captures, interval workers, teacher workers and caches.
auxiliary_spill_gib = 8
auxiliary_interval_lanes = 128 # Fastest 32/64/128 interval screen; shrinks to fit VRAM.
auxiliary_teacher_lanes = 128 # Drain may use the existing larger oracle limit.
fork_packed = false # Packed layouts were slower in the seeded 128-env screen.
fork_threads = 32
fork_suffix_cache = true # Reuse only exactly matching future physical checkpoints.
fork_cache_steps = 8
fork_cache_zombies = 128 # Larger live rosters safely miss the disposable cache.
fork_cache_projectiles = 256
fork_cache_vram_mib = 128 # Included in training.forecasts.vram_mib, not additional VRAM.
reach_chunk_ticks = 256 # Bounded Wait-only continuation; no additional policy calls.
compile_collection = true
compile_fitting = true
telemetry = true
telemetry_span_limit = 1024
fit_precision = "bf16_master"
prefetch = true
fit_batch_groups = 4
fit_encoder_microbatch = 192
fit_species_microbatch = 192
fit_tile_microbatch = 192
fit_entity_buckets = [8, 16, 32, 64, 128, 256]
fit_token_budget = 65536
collection_graph_cache_entries = 8
collection_tile_buckets = true # Bound decoder capture shapes as legal non-Wait counts change.
teacher_batched_transfers = true # One slab upload per refill; validate roots once at ingestion.
teacher_pipeline = true # Prepare roots during CUDA chunks; pinned event-polled progress.
factual_batch_targets = true # Exact range maxima and array target construction per episode.
vectorized_effect_gather = true # One indexed gather for tested outcome tokens, retaining loss normalization.
collection_vram_headroom_mib = 512

[splits]
train = [1000, 99999]
validation = [100000, 100049] # Panel size; actual validation seeds are freshly sampled.
curriculum = [100050, 100149] # Mastery panel capacity; validation draws fresh seeds outside reserved splits.
test = [200000, 200299]
ood = [300000, 300099]

[evaluation]
levels = ["easy", "standard", "hard"]
ood_families = ["redistributed", "faster", "concentrated"]
ood_levels = ["standard", "hard"]
replays_per_outcome = 10
bootstrap_replicates = 2000
bootstrap_seed = 1739
targets = [0.95, 0.90, 0.75]

[conditions.masked]
masked = true
shaped = true
curriculum = true
hybrid = false

[policy]
kind = "shared_public_forecast_q_v4"
action_distribution = "sequential_q_unmasked_tiles_v2"
shared_width = 192
encoder_blocks = 4
tile_decoder_blocks = 2
attention_heads = 12
feedforward_width = 768
encoder_microbatch = 128
attention_query_chunk = 64
encoder_token_budget = 65536

[training.demo]
passes = 40
learning_rate = 0.0003
learner_seed = 101
time_budget_minutes = 30

[simulation]
backend = "cuda"

[diagnostics]
reach_tracking = true # Disable only for bounded controls; no auxiliary labels when false.
early_dig_seconds = 5

# The demo profile intentionally inherits the same reward settings as training.
[profiles.demo]

[profiles.gpu_defaults]
simulator = "cuda"
device = "cuda"
n_envs = 128
benchmark_env_counts = [128]
benchmark_min_cohorts = 1


# Exact optional matches select presets; unlisted native-BF16 devices use generic.
# Calibrate locally on every new GPU/driver combination; names do not gate support.
[gpu_profiles.generic-bf16]
status = "conservative-unmeasured"
torch_threads = 1
performance = {fit_species_microbatch = 32, fit_tile_microbatch = 32, fit_token_budget = 8192, fit_batch_groups = 1, collection_vram_headroom_mib = 1024}

[gpu_profiles.rtx4070-laptop]
device_names = ["NVIDIA GeForce RTX 4070 Laptop GPU"]
status = "measured-eager-2026-10-15"
torch_threads = 2
performance = {compile_collection = true, compile_fitting = true, fit_species_microbatch = 64, fit_tile_microbatch = 64, fit_token_budget = 16384, fit_batch_groups = 2, collection_vram_headroom_mib = 1638}

[gpu_profiles.rtx4080-super]
device_names = ["NVIDIA GeForce RTX 4080 SUPER"]
status = "measured-32gib-2026-10-15"
torch_threads = 1
# The measured cloud device reports 32 GiB; retain the 20% collection reserve.
performance = {compile_collection = true, compile_fitting = true, fit_species_microbatch = 64, fit_tile_microbatch = 64, fit_token_budget = 16384, fit_batch_groups = 2, collection_vram_headroom_mib = 6554}

[gpu_profiles.rtx5090]
device_names = ["NVIDIA GeForce RTX 5090"]
# The complete 4070 calibration selected 64/64/16384 with four grouped
# batches as the fastest stable low-memory family.  The 5090 has four times
