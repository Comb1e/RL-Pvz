profile = "complete-game"
schema_version = 1
engine_commit = "1424b4d802e783a36772091c49d96aa7c6036d7a"
engine_version = "1.4.0"
engine_package_version = "1.7.0"

[runtime]
cache_legal_actions = true
refill_evaluation = true

[logging]
progress_seconds = 15
terminal_progress_seconds = 60
terminal_mode = "compact"
hardware_sample_seconds = 1.0
rolling_window = 100

[visualization]
live_enabled = true
viewer = "auto"
live_fps = 5
live_history_ram_mib = 16
live_window_size = [1600, 1050]
enabled = true
demos = true
videos = false
video_fps = 25
video_size = [1280, 820]
ffmpeg = "" # Empty discovers ffmpeg on PATH.
crf = 23
final_hold_seconds = 2

[environment]
action_timing = "per_tick"
decision_ticks = 1
cutoff_seconds = 1200
rows = 5
cols = 9
plants = ["sunflower", "peashooter", "wall_nut", "cherry_bomb", "potato_mine", "snow_pea", "chomper", "repeater"]
zombies = ["basic", "flag", "conehead", "buckethead", "pole_vaulting"]
plant_states = ["ready", "arming", "armed", "fusing", "digesting", "exploding", "detonating", "rising", "biting", "biting_got_one", "recovering"]
zombie_states = ["walking", "carrying_pole", "vaulting", "biting", "dead"]
mower_states = ["ready", "moving", "spent"]

[encoding]
version = "entity_v1"
max_entities = 256 # RTX 4070 Laptop: lower attention cost than 512; see docs/math/entity-inputs.md.
count_scale = 75
wave_scale = 15

[reward]
version = "net_value_v1"
win_reward = 1.0
loss_penalty = 1.0
basic_zombie_value = 50.0 # Sun-equivalent value per basic zombie's actual HP removed.
mower_value = 200.0
progress_weight = 0.01
value_scale = 300.0 # Unit conversion, never a sun cap.
home_entry_penalties = [0.005, 0.015] # First entry into the second, then first column.
win_time_weight = 0.1 # Victories relative to the current cohort's median duration.
early_sun_extra_multiplier = 2.0
early_sun_spawn_fraction = [1, 3]

[training]
gamma = 1.0
discount_clock = "simulation_ticks"
method = "complete_return_selective_invalid_v3"
budget_unit = "games"
until_stage_complete = false # With --stage: stop only when its mastery gate passes.
total_games = 10000
validation_schedule = "stage_success" # Normal-game evaluation only after each stage passes.
eval_interval_games = 2000 # Used by periodic game-count diagnostic/fixed checks.
total_steps = 3000000 # Inactive in normal training; bounded decision-window controls only.
learner_seeds = [101, 102]
n_envs = 128
device = "cuda"
max_minutes = 120
finalization_minutes = 15
# Both exploration probabilities are fixed throughout each complete-game cohort.
exploration = {objective = "committed_plant_tile_epsilon_v1", epsilon_start = 0.5, epsilon_floor = 0.01, decay_games = 10000, plant_epsilon_start = 0.1, plant_epsilon_floor = 0.01, plant_decay_games = 10000}
batch_size = 1024
n_epochs = 4
learning_rate = 0.0003
max_grad_norm = 5 # Shared by autonomous training and demonstration initialization.
eval_interval = 250000 # Used only by bounded decision-window diagnostics.
torch_threads = 1

[training.storage]
ram_gib = 6
block_rows = 32768

[training.objective]
protocol = "complete_return_selective_invalid_v3"
accepted_outcome_share = 0.5
species_consistency_weight = 1.0
species_consistency_huber_delta = 1.0
invalid_action_target = -1.0
invalid_fit_group_size = 100
dense_multiplier = 10.0
ema_decay = 0.95
demo_rank_loss_weight = 0.10
demo_rank_margin = 0.05

[training.performance]
compile_kernels = true
telemetry = true
fit_precision = "bf16_master"
prefetch = true
fit_batch_groups = 4
fit_encoder_microbatch = 192
fit_species_microbatch = 192
fit_tile_microbatch = 192
fit_entity_buckets = [8, 16, 32, 64, 128, 256]
fit_token_budget = 65536
collection_graph_cache_entries = 8
collection_vram_headroom_mib = 512

[curriculum]
mode = "teaching"
residency = "episode_start_stage"
probe_interval_games = 2000
minimum_stage_games = 100
probe_interval = 16384
probe_cases = 100
consecutive_passes = 1
minimum_stage_steps = 16384

boundaries = [0.1, 0.4]
easy_weights = [1.0, 0.0, 0.0]
intermediate_weights = [0.5, 0.5, 0.0]
final_weights = [0.2, 0.4, 0.4]

[splits]
train = [1000, 99999]
validation = [100000, 100049]
curriculum = [100050, 100149] # Separate mastery cases; never final-test seeds.
test = [200000, 200299]
ood = [300000, 300099]

[evaluation]
levels = ["easy", "standard", "hard"]
ood_families = ["redistributed", "faster", "concentrated"]
ood_levels = ["standard", "hard"]
replays_per_outcome = 10
bootstrap_replicates = 2000
bootstrap_seed = 1739
targets = [0.95, 0.90, 0.75]

[conditions.masked]
masked = true
shaped = true
curriculum = true
hybrid = false

[policy]
kind = "two_stage_transformer_q_v1"
action_distribution = "sequential_q_unmasked_penalty_v1"
species_width = 128
species_layers = 4
species_heads = 8
species_feedforward = 512
tile_width = 192
tile_layers = 6
tile_heads = 12
tile_feedforward = 768
encoder_microbatch = 128
attention_query_chunk = 64
encoder_token_budget = 65536

[training.demo]
passes = 40
learning_rate = 0.0003
learner_seed = 101
time_budget_minutes = 30

[training.annotation]
# Tile-only convergence: 0 means unlimited passes until every training record is correct.
passes = 0
learning_rate = 0.0003
batch_size = 256
margin = 1.0
learner_seed = 101
sampling_seed = "random"
sampling_family = "preset"
# Uniform endpoint in [0, sampling_max_steps]; finished games are retried.
sampling_max_steps = 20000
sampling_max_attempts = 100
sampling_plant_interval_steps = [500, 1500]
sampling_max_plants = 8

[curriculum.stages.easy]
tasks = ["easy"]
weights = [1.0]
requirements = {easy = 100}

[curriculum.stages.standard]
tasks = ["easy", "standard"]
weights = [0.5, 0.5]
requirements = {easy = 100, standard = 100}

[curriculum.stages.shared]
tasks = ["easy", "standard", "hard"]
weights = [0.2, 0.4, 0.4]
requirements = {easy = 100, standard = 100, hard = 100}

[simulation]
backend = "cuda"

[diagnostics]
early_dig_seconds = 5

# The demo profile intentionally inherits the same reward settings as training.
[profiles.demo]

[profiles.gpu_defaults]
simulator = "cuda"
device = "cuda"
n_envs = 128
benchmark_env_counts = [128]
benchmark_min_cohorts = 1


# Exact optional matches select presets; unlisted native-BF16 devices use generic.
# Calibrate locally on every new GPU/driver combination; names do not gate support.
[gpu_profiles.generic-bf16]
status = "conservative-unmeasured"
torch_threads = 1
performance = {fit_species_microbatch = 32, fit_tile_microbatch = 32, fit_token_budget = 8192, fit_batch_groups = 1, collection_vram_headroom_mib = 1024}

[gpu_profiles.rtx4070-laptop]
device_names = ["NVIDIA GeForce RTX 4070 Laptop GPU"]
status = "measured-eager-2026-10-15"
torch_threads = 2
performance = {compile_kernels = false, fit_species_microbatch = 64, fit_tile_microbatch = 64, fit_token_budget = 16384, fit_batch_groups = 2, collection_vram_headroom_mib = 1638}

[gpu_profiles.rtx4080-super]
device_names = ["NVIDIA GeForce RTX 4080 SUPER"]
status = "measured-32gib-2026-10-15"
torch_threads = 1
# The measured cloud device reports 32 GiB; retain the 20% collection reserve.
performance = {compile_kernels = true, fit_species_microbatch = 64, fit_tile_microbatch = 64, fit_token_budget = 16384, fit_batch_groups = 2, collection_vram_headroom_mib = 6554}

[gpu_profiles.rtx5090]
device_names = ["NVIDIA GeForce RTX 5090"]
# The complete 4070 calibration selected 64/64/16384 with four grouped
# batches as the fastest stable low-memory family.  The 5090 has four times
# the VRAM, so this provisional profile takes one bounded 2x step while
# retaining a 20% collection reserve until a native 5090 run completes.
status = "provisional-scaled-from-rtx4070-2026-10-15"
torch_threads = 1
performance = {compile_kernels = true, fit_species_microbatch = 128, fit_tile_microbatch = 128, fit_token_budget = 32768, fit_batch_groups = 4, collection_vram_headroom_mib = 6554}

[gpu_profiles.rtx4090]
device_names = ["NVIDIA GeForce RTX 4090"]
status = "provisional-cloud-calibration-required"
torch_threads = 1
performance = {fit_species_microbatch = 96, fit_tile_microbatch = 96, fit_token_budget = 24576, fit_batch_groups = 4, collection_vram_headroom_mib = 4916}

[gpu_profiles.rtx-pro6000]
device_names = ["NVIDIA RTX PRO 6000 Blackwell Workstation Edition", "NVIDIA RTX PRO 6000 Blackwell Server Edition"]
status = "provisional-cloud-calibration-required"
torch_threads = 1
performance = {fit_species_microbatch = 192, fit_tile_microbatch = 192, fit_token_budget = 65536, fit_batch_groups = 4, collection_vram_headroom_mib = 19661}

[gpu_profiles.rtx6000d]
device_names = ["NVIDIA RTX 6000D"]
status = "provisional-cloud-calibration-required"
torch_threads = 1
performance = {fit_species_microbatch = 192, fit_tile_microbatch = 192, fit_token_budget = 65536, fit_batch_groups = 4, collection_vram_headroom_mib = 17204}

[learning_profiles.lr-half]
learning_rate = 0.00015

[learning_profiles.lr-double]
learning_rate = 0.0006

[tuning]
repetitions = 3
within_fastest_fraction = 0.05
minimum_headroom_fraction = 0.20
minimum_headroom_mib = 1024
rows_per_width = 8
learner_seeds = [101, 102]
learning_rate_multipliers = [1.0, 0.5, 2.0]
cohorts = 2
# Change one execution dimension at a time; bound trials by the shared deadline.
candidates = [
  {species = 32, tile = 32, tokens = 8192, groups = 1, threads = 1},
  {species = 64, tile = 32, tokens = 16384, groups = 1, threads = 1},
  {species = 64, tile = 64, tokens = 16384, groups = 2, threads = 1},
  {species = 128, tile = 64, tokens = 32768, groups = 4, threads = 1},
  {species = 128, tile = 128, tokens = 32768, groups = 4, threads = 1},
  {species = 192, tile = 192, tokens = 65536, groups = 4, threads = 1},
  {species = 64, tile = 64, tokens = 16384, groups = 2, threads = 2},
  {species = 64, tile = 64, tokens = 16384, groups = 2, threads = 4},
  {species = 64, tile = 64, tokens = 16384, groups = 4, threads = 1},
  {species = 64, tile = 64, tokens = 16384, groups = 8, threads = 1},
  {species = 96, tile = 96, tokens = 24576, groups = 4, threads = 1},
  {species = 96, tile = 96, tokens = 24576, groups = 8, threads = 1},
  {species = 128, tile = 128, tokens = 32768, groups = 4, threads = 2},
  {species = 128, tile = 128, tokens = 32768, groups = 4, threads = 4},
  {species = 128, tile = 128, tokens = 32768, groups = 8, threads = 1},
  {species = 128, tile = 192, tokens = 49152, groups = 4, threads = 1},
  {species = 192, tile = 128, tokens = 49152, groups = 4, threads = 1},
  {species = 192, tile = 192, tokens = 65536, groups = 8, threads = 1},
]
