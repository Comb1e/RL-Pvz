profile = "complete-game"
schema_version = 1
engine_commit = "1424b4d802e783a36772091c49d96aa7c6036d7a"
engine_version = "1.4.0"
engine_package_version = "1.7.0"

[runtime]
cache_legal_actions = true
refill_evaluation = true

[logging]
progress_seconds = 15
hardware_sample_seconds = 1.0
rolling_window = 100

[visualization]
live_enabled = true
live_fps = 5
live_history_ram_mib = 16
live_window_size = [1600, 1050]
enabled = true
demos = true
videos = false
video_fps = 25
video_size = [1280, 820]
ffmpeg = "" # Empty discovers ffmpeg on PATH.
crf = 23
final_hold_seconds = 2

[environment]
action_timing = "per_tick"
decision_ticks = 1
cutoff_seconds = 1200
rows = 5
cols = 9
plants = ["sunflower", "peashooter", "wall_nut", "cherry_bomb", "potato_mine", "snow_pea", "chomper", "repeater"]
zombies = ["basic", "flag", "conehead", "buckethead", "pole_vaulting"]
plant_states = ["ready", "arming", "armed", "fusing", "digesting", "exploding", "detonating", "rising", "biting", "biting_got_one", "recovering"]
zombie_states = ["walking", "carrying_pole", "vaulting", "biting", "dead"]
mower_states = ["ready", "moving", "spent"]

[encoding]
version = "entity_v1"
max_entities = 256 # RTX 4070 Laptop: lower attention cost than 512; see docs/math/entity-inputs.md.
count_scale = 75
wave_scale = 15

[reward]
version = "net_value_v1"
win_reward = 1.0
loss_penalty = 2.0
basic_zombie_value = 50.0 # Sun-equivalent value per basic zombie's actual HP removed.
mower_value = 200.0
progress_weight = 0.01
value_scale = 300.0 # Unit conversion, never a sun cap.
invalid_plant_penalty = 0.003 # Rejected plant proposal, 90 sun-equivalents.
empty_dig_penalty = 0.0003333333333333333 # Empty dig proposal, 10 sun-equivalents.

[training]
gamma = 1.0
discount_clock = "simulation_ticks"
method = "complete_return_lstm_v1"
budget_unit = "games"
until_stage_complete = false # With --stage: stop only when its mastery gate passes.
total_games = 10000
validation_schedule = "stage_success" # Normal-game evaluation only after each stage passes.
eval_interval_games = 2000 # Used by diagnostic/fixed training or archived periodic schedules.
total_steps = 3000000 # Inactive unless budget_unit = "decisions" (legacy).
learner_seeds = [101, 102]
n_envs = 128
device = "cuda"
max_minutes = 120
finalization_minutes = 15
# Tile-only exploration is fixed throughout each complete-game cohort.
exploration = {objective = "sequential_tile_epsilon_v1", epsilon_start = 0.5, epsilon_floor = 0.01, decay_games = 5000}
batch_size = 1024
n_epochs = 4
learning_rate = 0.0003
max_grad_norm = 0.5
hidden_sizes = [128, 128]
eval_interval = 250000 # Periodic decision interval for archived/diagnostic protocols.
torch_threads = 1

[training.storage]
ram_gib = 6
block_rows = 32768

[training.performance]
compile_kernels = true
telemetry = true
fit_precision = "features_bf16"
prefetch = true
fit_sequence_groups = 4

[curriculum]
mode = "teaching"
residency = "episode_start_stage"
probe_interval_games = 2000
minimum_stage_games = 100
probe_interval = 16384
probe_cases = 100
consecutive_passes = 1
minimum_stage_steps = 16384

boundaries = [0.1, 0.4]
easy_weights = [1.0, 0.0, 0.0]
intermediate_weights = [0.5, 0.5, 0.0]
final_weights = [0.2, 0.4, 0.4]

[splits]
train = [1000, 99999]
validation = [100000, 100049]
curriculum = [100050, 100149] # Separate mastery cases; never final-test seeds.
test = [200000, 200299]
ood = [300000, 300099]

[evaluation]
levels = ["easy", "standard", "hard"]
ood_families = ["redistributed", "faster", "concentrated"]
ood_levels = ["standard", "hard"]
replays_per_outcome = 10
bootstrap_replicates = 2000
bootstrap_seed = 1739
targets = [0.95, 0.90, 0.75]

[conditions.masked]
masked = true
shaped = true
curriculum = true
hybrid = false

[policy]
kind = "transformer_lstm_q_v2"
action_distribution = "sequential_q_unmasked_penalty_v1"
entity_width = 32
transformer_layers = 2
transformer_heads = 4
transformer_feedforward = 64
scalar_width = 64
lstm_hidden = 256
action_embedding = 32
outcome_width = 16
chunk_length = 256
encoder_microbatch = 128
attention_query_chunk = 64
encoder_token_budget = 65536

[training.demo]
passes = 5
learning_rate = 0.0003
gradient_clip = 0.5
learner_seed = 101
time_budget_minutes = 30

[curriculum.stages.easy]
tasks = ["easy"]
weights = [1.0]
requirements = {easy = 100}

[curriculum.stages.standard]
tasks = ["easy", "standard"]
weights = [0.5, 0.5]
requirements = {easy = 100, standard = 100}

[curriculum.stages.shared]
tasks = ["easy", "standard", "hard"]
weights = [0.2, 0.4, 0.4]
requirements = {easy = 100, standard = 100, hard = 100}

[simulation]
backend = "cuda"

[diagnostics]
early_dig_seconds = 5

# All runnable profiles share this file. The loader applies these sparse overlays
# to the base training profile so shared parameters have one source of truth.
[profiles.demo.reward]
invalid_plant_penalty = 0.001

[profiles.gpu_defaults]
simulator = "cuda"
device = "cuda"
n_envs = 128
benchmark_env_counts = [128]
benchmark_min_cohorts = 1
