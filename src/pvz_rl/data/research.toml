profile = "compact-ppo"
schema_version = 1
engine_commit = "8861824df6893a34c2cd4df7f9b68613376d7964"
engine_version = "1.0.0"
engine_package_version = "1.3.0"

[runtime]
cache_legal_actions = true
refill_evaluation = true

[logging]
progress_seconds = 15
rolling_window = 100

[visualization]
enabled = true
demos = true
videos = false
video_size = [1280, 820]
ffmpeg = "" # Empty discovers ffmpeg on PATH.
crf = 23
final_hold_seconds = 2

[environment]
action_timing = "per_tick"
decision_ticks = 1
cutoff_seconds = 1200
rows = 5
cols = 9
bins = 3
plants = ["sunflower", "peashooter", "wall_nut", "cherry_bomb", "potato_mine", "snow_pea", "chomper", "repeater"]
zombies = ["basic", "flag", "conehead", "buckethead", "pole_vaulting"]
plant_states = ["ready", "arming", "armed", "fusing", "digesting", "exploding", "detonating"]
zombie_states = ["walking", "carrying_pole", "vaulting", "biting", "dead"]
mower_states = ["ready", "moving", "spent"]

[encoding]
version = "compact_v3"
local_count_scale = 5
count_scale = 75
wave_scale = 15

[reward]
version = "net_value_v1"
win_reward = 1.0
loss_penalty = 2.0
basic_zombie_value = 50.0 # Sun-equivalent value per basic zombie's actual HP removed.
mower_value = 600.0
progress_weight = 0.1
value_scale = 300.0 # Unit conversion, never a sun cap.

[training]
gamma = 0.999
discount_clock = "simulation_ticks"
budget_unit = "games"
total_games = 10000
validation_schedule = "stage_success" # Normal-game evaluation only after each stage passes.
eval_interval_games = 2000 # Used by diagnostic/fixed training or archived periodic schedules.
total_steps = 3000000 # Inactive unless budget_unit = "decisions" (legacy).
learner_seeds = [101, 102]
n_envs = 256
device = "cuda"
rollout_size = 32768
rollout_steps_per_env = 128 # Learning transitions per environment per update, not a game limit.
max_minutes = 120
finalization_minutes = 15
exploration = {objective = "balanced_heads_v1", type_coef = 0.01, tile_coef = 0.001}
batch_size = 1024
n_epochs = 4
learning_rate = 0.0003 # Actor rate; critic uses this unless critic_learning_rate is set.
value_batch_size = 1024 # Frozen critic inference after collection.
gae_lambda = 0.999
clip_range = 0.2
vf_coef = 0.5
max_grad_norm = 0.5
normalize_advantage = true
target_kl = 0.01 # Zero disables KL stopping.
hidden_sizes = [128, 128]
eval_interval = 250000 # Periodic decision interval for archived/diagnostic protocols.
torch_threads = 1

[curriculum]
mode = "teaching"
residency = "episode_start_stage"
probe_interval_games = 2000
minimum_stage_games = 100
probe_interval = 16384
probe_cases = 100
consecutive_passes = 1
minimum_stage_steps = 16384

boundaries = [0.1, 0.4]
easy_weights = [1.0, 0.0, 0.0]
intermediate_weights = [0.5, 0.5, 0.0]
final_weights = [0.2, 0.4, 0.4]

[splits]
train = [1000, 99999]
validation = [100000, 100049]
curriculum = [100050, 100149] # Separate mastery cases; never final-test seeds.
test = [200000, 200299]
ood = [300000, 300099]

[evaluation]
levels = ["easy", "standard", "hard"]
ood_families = ["redistributed", "faster", "concentrated"]
ood_levels = ["standard", "hard"]
replays_per_outcome = 10
bootstrap_replicates = 2000
bootstrap_seed = 1739
targets = [0.95, 0.90, 0.75]

[conditions.masked]
masked = true
shaped = true
curriculum = true
hybrid = false

[policy]
kind = "spatial_grouped_v4"
initial_dig_logit = -6.0
plant_embedding = 8
state_embedding = 4
scalar_sizes = [64]
channels = [32, 32]

[curriculum.lessons.placement]
spawn_ticks = [1, 21, 41]
initial_sun = 100
natural_sun = false
allowed_plants = ["peashooter"]

[curriculum.lessons.saving]
spawn_ticks = [860, 1100, 1340] # 43 seconds, then every 12 seconds in both lanes.
initial_sun = 150
natural_sun = false
lanes_per_spawn = 2 # 150 sun alone cannot buy two shooters; income investment is necessary.
allowed_plants = ["sunflower", "peashooter"]

[curriculum.stages.placement]
tasks = ["placement"]
weights = [1.0]
requirements = {placement = 100}

[curriculum.stages.saving]
tasks = ["saving", "placement"]
weights = [0.8, 0.2]
requirements = {saving = 100}

[curriculum.stages.easy]
tasks = ["easy", "placement", "saving"]
weights = [0.8, 0.1, 0.1]
requirements = {easy = 100}

[curriculum.stages.standard]
tasks = ["easy", "standard", "saving"]
weights = [0.45, 0.45, 0.1]
requirements = {easy = 100, standard = 100}

[curriculum.stages.shared]
tasks = ["easy", "standard", "hard"]
weights = [0.2, 0.4, 0.4]
requirements = {easy = 100, standard = 100, hard = 100}

[simulation]
backend = "cuda"

[diagnostics]
early_dig_seconds = 5
