mode = "teaching"
residency = "episode_start_stage"
probe_interval_games = 2000
minimum_stage_games = 100
probe_interval = 16384
probe_cases = 100
consecutive_passes = 1
minimum_stage_steps = 16384

[lessons.saving]
spawn_ticks = [7500, 8700, 9900] # 75 seconds, then every 12 seconds in three lanes.
initial_sun = 100
natural_sun = false
lanes_per_spawn = 3
allowed_plants = ["sunflower", "peashooter", "wall_nut", "cherry_bomb", "potato_mine", "snow_pea", "chomper", "repeater"]

[stages.saving]
tasks = ["saving"]
weights = [1.0]
requirements = {saving = 100}

[stages.easy]
tasks = ["easy", "saving"]
weights = [0.8, 0.2]
requirements = {easy = 100}

[stages.standard]
tasks = ["easy", "standard", "saving"]
weights = [0.45, 0.45, 0.1]
requirements = {easy = 100, standard = 100}

[stages.shared]
tasks = ["easy", "standard", "hard"]
weights = [0.2, 0.4, 0.4]
requirements = {easy = 100, standard = 100, hard = 100}
